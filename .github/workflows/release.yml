name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      source_revision: ${{ steps.metadata.outputs.source_revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source version and release tag
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release_metadata.py --tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" --notes-file release-notes.md

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  packages:
    needs: [version, tests]
    uses: ./.github/workflows/package.yml

  github_release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          SOURCE_REVISION: ${{ needs.version.outputs.source_revision }}
        run: |
          sha256sum --check SHA256SUMS
          python tools/release_metadata.py --tag "$RELEASE_TAG" --source-revision "$SOURCE_REVISION" --assets . --build-manifest expected-release-build.json --notes-file release-notes.md --repository "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cmp release-build.json expected-release-build.json
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --notes-file release-notes.md --title "NKS AudioLink $RELEASE_VERSION")
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" nks-audiolink-windows-x64.zip nks-audiolink-linux-x64.tar.gz SHA256SUMS windows-package-verification.json linux-package-verification.json release-build.json "${args[@]}"
