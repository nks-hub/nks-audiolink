name: Package binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package version
        run: python tools/release_metadata.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.318'
      - name: Select release SDK
        run: dotnet new globaljson --sdk-version 9.0.318 --roll-forward disable --force
      - name: Publish Windows app
        run: dotnet publish src/NksAudioLink.App/NksAudioLink.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/windows
      - name: Publish Windows CLI
        run: dotnet publish src/NksAudioLink.Cli/NksAudioLink.Cli.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/cli
      - name: Add public documentation and licenses
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/windows/cli -Force | Out-Null
          Copy-Item -Path publish/cli/* -Destination publish/windows/cli -Recurse -Force
          Copy-Item README.md, LICENSE, TODO.md, CHANGELOG.md, THIRD_PARTY_NOTICES.md -Destination publish/windows
          Copy-Item docs -Destination publish/windows/docs -Recurse
          New-Item -ItemType Directory -Path publish/windows/licenses -Force | Out-Null
          Copy-Item deploy/licenses/dotnet-coreapp-win-x64 -Destination publish/windows/licenses/dotnet-coreapp-win-x64 -Recurse
          Copy-Item deploy/licenses/dotnet-windowsdesktop-win-x64 -Destination publish/windows/licenses/dotnet-windowsdesktop-win-x64 -Recurse
      - name: Verify and package Windows binaries
        run: python tools/verify_release.py publish/windows --platform windows-x64 --create-archive nks-audiolink-windows-x64.zip --report windows-package-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            nks-audiolink-windows-x64.zip
            windows-package-verification.json
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package version
        run: python tools/release_metadata.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.318'
      - name: Select release SDK
        run: dotnet new globaljson --sdk-version 9.0.318 --roll-forward disable --force
      - name: Publish Linux server
        run: dotnet publish src/NksAudioLink.Server/NksAudioLink.Server.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish/linux
      - name: Add public documentation and licenses
        run: |
          cp README.md LICENSE TODO.md CHANGELOG.md THIRD_PARTY_NOTICES.md publish/linux/
          cp -R docs publish/linux/docs
          mkdir -p publish/linux/licenses
          cp -R deploy/licenses/dotnet-coreapp-linux-x64 publish/linux/licenses/
          cp -R deploy/licenses/dotnet-aspnetcore-linux-x64 publish/linux/licenses/
          mkdir -p publish/linux/deploy
          cp -R deploy/linux publish/linux/deploy/linux
          chmod +x publish/linux/NksAudioLink.Server publish/linux/deploy/linux/install.sh
      - name: Verify and package Linux binaries
        run: python tools/verify_release.py publish/linux --platform linux-x64 --create-archive nks-audiolink-linux-x64.tar.gz --report linux-package-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            nks-audiolink-linux-x64.tar.gz
            linux-package-verification.json
          if-no-files-found: error

  checksums:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          merge-multiple: true
      - name: Hash verified packages
        run: sha256sum nks-audiolink-windows-x64.zip nks-audiolink-linux-x64.tar.gz > SHA256SUMS
      - name: Record product version and source revision
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: python tools/release_metadata.py --tag "$RELEASE_TAG" --source-revision "$GITHUB_SHA" --assets . --build-manifest release-build.json
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: |
            SHA256SUMS
            release-build.json
          if-no-files-found: error
